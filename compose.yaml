services:
  sfmap:
    build: .
    init: true
    restart: unless-stopped
    user: "${SFMAP_UID:-1000}:${SFMAP_GID:-1000}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3000}:3000"
      - "${SHARE_BIND:-127.0.0.1}:${SHARE_PORT:-3001}:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      SHARE_PORT: 3001
      SHARE_HOST: ${SHARE_HOST:-0.0.0.0}
      DATA_DIR: /app/data
      SECRETS_DIR: /app/secrets
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_TRANSPORT: ${TELEGRAM_TRANSPORT:-proxy}
      TELEGRAM_PROXY_MODE: ${TELEGRAM_PROXY_MODE:-external}
      TELEGRAM_PROXY_FILE: /app/data/telegram-proxies.json
      TELEGRAM_PROXY_URLS: ${TELEGRAM_PROXY_URLS:-}
      TELEGRAM_LOCAL_PROXY_URL: ${TELEGRAM_LOCAL_PROXY_URL:-}
    volumes:
      - sfmap-data:/app/data
      - ./secrets:/app/secrets:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  sfmap-data:
