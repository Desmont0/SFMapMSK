services:
  sfmap:
    build: .
    init: true
    restart: unless-stopped
    user: "${SFMAP_UID:-1000}:${SFMAP_GID:-1000}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3000}:3000"
      - "${SHARE_BIND:-127.0.0.1}:${SHARE_PORT:-3001}:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      SHARE_PORT: 3001
      SHARE_HOST: ${SHARE_HOST:-0.0.0.0}
      DATA_DIR: /app/data
      SECRETS_DIR: /app/secrets
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      MAP_CACHE_AUTO: ${MAP_CACHE_AUTO:-true}
    volumes:
      - sfmap-data:/app/data
      - ./secrets:/app/secrets:rw
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  sfmap-data:
