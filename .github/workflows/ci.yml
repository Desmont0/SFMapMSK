name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium webkit
      - name: Check mobile browsers
        run: npm run test:browser
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
      - name: Check Bash syntax
        run: bash -n install.sh && bash -n update.sh && bash -n tests/deployment.sh
      - name: Audit dependencies
        run: npm audit --audit-level=low

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: node
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare isolated configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p secrets
          chmod 700 secrets
          cat > .env <<'EOF'
          HOST=0.0.0.0
          PORT=18080
          HOST_BIND=127.0.0.1
          PUBLIC_ORIGIN=http://localhost:18080
          SHARE_PORT=18081
          SHARE_BIND=127.0.0.1
          SHARE_HOST=0.0.0.0
          DATA_DIR=./data
          SECRETS_DIR=./secrets
          SFMAP_UID=1000
          SFMAP_GID=1000
          COOKIE_SECURE=false
          MAP_CACHE_AUTO=false
          EOF
          chmod 600 .env
      - name: Reproduce restrictive update checkout permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          git ls-files -z | xargs -0 chmod go-rwx
          find src shared server scripts tests public -type d -exec chmod go-rwx {} +
          test "$(stat -c '%a' package.json)" = 600
      - name: Build image
        run: docker compose build
      - name: Check image with a different unprivileged UID
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose run --rm --no-deps -T --user 12345:12345 \
            -e DATA_DIR=/tmp/sfmap-data -e SECRETS_DIR=/tmp/sfmap-secrets \
            sfmap npm run db:migrate
      - name: Validate remote admin Compose override
        run: docker compose -f compose.yaml -f compose.remote-admin.yaml config --quiet
      - name: Prepare writable volumes
        run: docker compose run --rm --no-deps --user 0 --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE --entrypoint /bin/sh sfmap -c 'chown -R 1000:1000 /app/data /app/secrets'
      - name: Create admin key and database
        shell: bash
        run: |
          set -Eeuo pipefail
          test_password="SFMap-CI-$(openssl rand -hex 16)"
          printf '%s\n' "$test_password" | docker compose run --rm --no-deps -T sfmap npm run setup-admin -- --password-stdin
      - name: Start and wait for health
        run: docker compose up -d --wait --wait-timeout 120
      - name: Check listeners and SQLite source
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error http://127.0.0.1:18080/api/health | grep -q '"source":"sqlite"'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/participants | grep -q '"source":"sqlite"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/admin/session)" = 404
          docker compose exec -T sfmap test -s /app/secrets/admin-access.txt
      - name: Verify persistence after recreate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:18080/api/health | grep -q '"source":"sqlite"'
          docker compose exec -T sfmap test -s /app/secrets/admin-access.txt
      - name: Test upgrades, rollback and installer modes
        run: bash tests/deployment.sh
      - name: Cleanup
        if: always()
        run: |
          data_volume=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Name}}{{end}}{{end}}' "$(docker compose ps -aq sfmap)" 2>/dev/null || true)
          docker compose down --volumes --remove-orphans
          if [[ -n "$data_volume" ]]; then docker volume rm "$data_volume" || true; fi
